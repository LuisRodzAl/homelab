name: Validate Homelab Compose

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    name: Lint & Validate Docker Compose
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Prepare test environment file
        run: |
          cp env.example .env

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config --quiet
          echo "✅ docker-compose.yml syntax and configuration is valid!"
